{{/* Self-hosted LiveKit SFU. The Mac daemon (home robot) and the in-pod controller both DIAL
     OUT to it, which sidesteps home/cloud symmetric NAT — only the CLB needs inbound. */}}
{{- $name := default .Release.Name .Values.nameOverride -}}
{{/* nodeIp is what ICE hands clients as the reachable address; get it wrong and media never
     connects even though signalling looks fine. It is the CLB's PUBLIC IP — and this chart
     creates that CLB, so demanding the IP as an input was circular: you cannot know it until
     after the first install, and the install path (the VKE console's Helm page) has no shell in
     which to look it up and re-run.

     So: leave nodeIp empty and an init container waits for the CLB to be assigned an IP and
     hands it over. Set it explicitly to skip that entirely — worth doing once the IP is known,
     since it removes the RBAC and the wait. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  labels: { app: {{ $name }} }
data:
  config.yaml: |
    port: {{ .Values.service.ports.signal }}
    log_level: info
    rtc:
      tcp_port: {{ .Values.service.ports.rtcTcp }}
      udp_port: {{ .Values.service.ports.rtcUdp }}
      use_external_ip: false   # the public IP comes from --node-ip, not STUN
    # no `keys:` block on purpose — LIVEKIT_KEYS (from the Secret) supplies them
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: { app: {{ $name }} }
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ $name }} }
  template:
    metadata:
      labels: { app: {{ $name }} }
    spec:
      {{- if not .Values.nodeIp }}
      serviceAccountName: {{ $name }}-ip
      initContainers:
        {{/* Same image as the server on purpose: it already has sh + wget, and pulling a second
             image (kubectl, curl) is a slow, failure-prone extra dependency from CN. It talks to
             the API server with the pod's own token; the Role grants nothing but `get` on this
             one Service. */}}
        - name: wait-clb-ip
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              API=https://kubernetes.default.svc
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              for i in $(seq 1 120); do
                IP=$(wget -qO- --ca-certificate=$SA/ca.crt \
                      --header="Authorization: Bearer $(cat $SA/token)" \
                      "$API/api/v1/namespaces/$(cat $SA/namespace)/services/{{ $name }}-clb" \
                      | tr ',' '\n' | grep -o '"ip":"[^"]*"' | head -1 | cut -d'"' -f4 || true)
                if [ -n "${IP:-}" ]; then
                  echo "$IP" > /shared/node_ip
                  echo "[wait-clb-ip] CLB public IP = $IP"
                  exit 0
                fi
                echo "[wait-clb-ip] CLB has no external IP yet ($i/120), waiting…"
                sleep 5
              done
              echo "[wait-clb-ip] the CLB never got an external IP. Check the Service's events —" >&2
              echo "  a subnetId outside this cluster's VPC is the usual cause." >&2
              exit 1
          volumeMounts:
            - { name: shared, mountPath: /shared }
      {{- end }}
      containers:
        - name: livekit
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.nodeIp }}
          args: ["--config", "/etc/livekit/config.yaml", "--node-ip", {{ .Values.nodeIp | quote }}]
          {{- else }}
          {{/* `exec` so the server stays PID 1 and still receives SIGTERM on shutdown. */}}
          command: ["sh", "-c"]
          args: ["exec /livekit-server --config /etc/livekit/config.yaml --node-ip \"$(cat /shared/node_ip)\""]
          {{- end }}
          env:
            {{/* NOT optional: a missing Secret must hold the pod in
                 CreateContainerConfigError rather than start a public SFU with no credentials. */}}
            - name: LIVEKIT_KEYS
              valueFrom:
                secretKeyRef: { name: {{ .Values.auth.secretName }}, key: {{ .Values.auth.secretKey }} }
          ports:
            - { containerPort: {{ .Values.service.ports.signal }} }
            - { containerPort: {{ .Values.service.ports.rtcTcp }} }
            - { containerPort: {{ .Values.service.ports.rtcUdp }}, protocol: UDP }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/livekit }
            {{- if not .Values.nodeIp }}
            - { name: shared, mountPath: /shared }
            {{- end }}
      volumes:
        - name: config
          configMap: { name: {{ $name }}-config }
        {{- if not .Values.nodeIp }}
        - name: shared
          emptyDir: {}
        {{- end }}
---
{{/* Owns a CLB with a dedicated public IP. Separate from the console, which is on APIG. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-clb
  labels: { app: {{ $name }} }
  annotations:
    {{/* The CLB is a billed, slowly-provisioned resource holding a PUBLIC IP that every client
         has baked into its --livekit-url. It outlives any single release, so Helm must not
         delete it on uninstall — without this, removing a console would take the SFU's address
         with it and silently break every robot pointing at it. Delete it deliberately:
           kubectl delete svc <name>-clb */}}
    helm.sh/resource-policy: keep
    service.beta.kubernetes.io/volcengine-loadbalancer-subnet-id: {{ .Values.service.subnetId | quote }}
    service.beta.kubernetes.io/volcengine-loadbalancer-address-type: {{ .Values.service.addressType | quote }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector: { app: {{ $name }} }
  ports:
    - { name: signal,  port: {{ .Values.service.ports.signal }}, protocol: TCP, targetPort: {{ .Values.service.ports.signal }} }
    - { name: rtc-tcp, port: {{ .Values.service.ports.rtcTcp }}, protocol: TCP, targetPort: {{ .Values.service.ports.rtcTcp }} }
    - { name: rtc-udp, port: {{ .Values.service.ports.rtcUdp }}, protocol: UDP, targetPort: {{ .Values.service.ports.rtcUdp }} }
