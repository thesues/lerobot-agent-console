{{- $name := default .Release.Name .Values.nameOverride -}}
{{/* LiveKit API credentials.

     Owned by the chart because the install path is the VKE console's Helm page, which has no
     shell: "create this Secret first" makes the chart uninstallable there. `existingSecret`
     stays available for anyone who does have a shell and would rather the key never appear in
     values.yaml at all. */}}
{{- if not (or .Values.auth.keys .Values.auth.existingSecret) }}
{{- fail "livekit: set auth.keys (format `api_key: api_secret`, one per line) or point auth.existingSecret at a Secret you made. This SFU is published on a CLB, so it must not start with an absent or guessable key — generate one with `openssl rand -hex 32`." }}
{{- end }}
{{- if not .Values.service.subnetId }}
{{- fail "livekit: service.subnetId is required — the CLB is created from it and it must be a subnet in this cluster's VPC. Without a valid one the load balancer never gets a public IP and media never connects." }}
{{- end }}
{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-auth
  labels: { app: {{ $name }} }
type: Opaque
stringData:
  keys: |
    {{- .Values.auth.keys | nindent 4 }}
{{- end }}
