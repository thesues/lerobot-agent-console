# Defaults describe the DEV console. The test console is the same chart with values-test.yaml,
# whose only real difference is the name — dev and test were byte-identical apart from that,
# which is the whole reason this is one chart instead of two manifests kept in sync by hand.

# Pinned, NOT derived from the release name — these are two fixed environments, not arbitrary
# releases, and the resource name determines the PVC name (hermes-home-<name>-0) and the pod
# DNS the multi-node training addresses. Changing it strands the old disk and creates an empty
# one, so it must never drift by accident.
nameOverride: lerobot-agent-console

image:
  repository: iaas-us-cn-beijing.cr.volces.com/physicalai/lerobot-agent-console
  tag: 8ff8fd8885aff726d1d734e77a6a31a9a1f8e14f   # keep in sync with what is deployed
  pullPolicy: IfNotPresent

# Both consoles are pinned to the H20 box. ebs-* volumes are ZONAL, so a PVC bound in another
# zone can never attach here — moving nodes means recreating the PVC empty.
nodeSelector:
  kubernetes.io/hostname: "192.168.1.2"

resources:
  requests: { cpu: "16", memory: 128Gi, nvidia.com/gpu: "1" }
  limits:   { cpu: "16", memory: 128Gi, nvidia.com/gpu: "1" }

# RDMA pins (mlocks) memory; the container default `ulimit -l` is 64 KB with an equal hard
# limit, so NCCL picks the RoCE NIC and then fails to allocate. CAP_IPC_LOCK is the k8s fix.
capabilities: ["IPC_LOCK"]

persistence:
  storageClass: ebs-essd
  # The REAL size: both bound PVCs are 1Ti (spec and status), resized by editing the PVCs
  # directly. The live StatefulSet templates still say 128Gi, because editing a PVC does not —
  # and cannot — update the template it came from.
  # ⚠️ volumeClaimTemplates is IMMUTABLE, so a plain `helm upgrade` against those StatefulSets
  # is REJECTED while this differs from 128Gi. Adopting them needs a one-time
  # `kubectl delete sts --cascade=orphan` (keeps pods and PVCs) before the first install —
  # see charts/README.md. A fresh install gets 1Ti directly and needs none of that.
  size: 1Ti

# /dev/shm for the PyTorch DataLoader. The 64Mi container default overflows ("Bus error" /
# "out of shared memory") and the container cannot remount it without CAP_SYS_ADMIN.
dshmSize: 32Gi

auth:
  secretName: lerobot-console-auth   # keys: user, password. NOT created by this chart.

env:
  # An ORDERED LIST, not a map: Helm's `range` sorts map keys, and reordering container env
  # changes the pod-template hash — which would restart both consoles on the first upgrade for
  # no reason. Keep this in the same order as the running StatefulSets.
  - { name: PORT, value: "8080" }
  - { name: CONSOLE_WORKDIR, value: /lerobot }        # the lerobot checkout in the image
  - { name: CONSOLE_SHELL, value: /bin/bash }
  # lerobot 0.6.x hard-errors if LEROBOT_HOME is set at all; HF_LEROBOT_HOME is the right var,
  # and it must point at the writable PVC (the image default is unreadable as root).
  - { name: HF_LEROBOT_HOME, value: /opt/data/.cache/huggingface/lerobot }
  - { name: HOME, value: /opt/data }                  # image default is 700, owned by another user
  - { name: HERMES_CHAT_SKILL, value: robot_sft }
  - { name: HERMES_HOME, value: /opt/data }

# Public entry point. ONLY the Ingress (routing) is templated — the APIGInstance CRD that
# provisions the gateway and owns its *.volceapi.com domain stays in k8s/, because a stray
# `helm uninstall` would delete the gateway and take the domain with it.
apig:
  enabled: true
  ingressName: console-dev-apig
  # Each console sits behind its OWN APIG instance, so the class is per-environment.
  ingressClassName: apig
  # A distinct host per environment is what earns each its own managed domain.
  # ⚠️ Never put the auto-assigned *.volceapi.com name here — doing that once killed the
  # 443 listener outright (503 -> 000).
  host: console-dev.apig.test
  annotations:
    ingress.vke.volcengine.com/apig-instance-name: gd9khpnlb1nffgnhcadcg-apig-instance
    ingress.vke.volcengine.com/loadbalancer-id: gd9khpnlb1nffgnhcadcg
