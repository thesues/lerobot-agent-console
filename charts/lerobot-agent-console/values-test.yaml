# The TEST console. Deliberately minimal: if something other than the name needs to differ,
# think twice — the two environments being identical is what makes test meaningful.
# Reuses the dev login Secret; its own PVC comes from its own StatefulSet.
nameOverride: lerobot-agent-console-test

# The test console has its OWN APIG instance (own gateway, own domain), so class + host differ.
apig:
  enabled: true
  ingressName: console-test-apig
  ingressClassName: apig-test
  host: console-test.apig.test
  # The test gateway is selected by ingressClassName alone. `annotations: {}` would NOT work
  # here — Helm merges maps, so dev's instance id would leak through (it did, and broke it).
  noAnnotations: true
