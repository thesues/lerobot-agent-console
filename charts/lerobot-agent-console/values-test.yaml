# The TEST console. Deliberately minimal: if something other than the name needs to differ,
# think twice — the two environments being identical is what makes test meaningful.
# Reuses the dev login Secret; its own PVC comes from its own StatefulSet.
nameOverride: lerobot-agent-console-test

# The test console has its OWN APIG instance (own gateway, own domain), so class + host differ.
apig:
  enabled: true
  ingressName: console-test-apig
  ingressClassName: apig-test
  host: console-test.apig.test
  # Bind the gateway EXPLICITLY, like dev, instead of relying on ingressClassName alone —
  # a class name is a weak claim, and another Ingress declaring the same class can take the
  # instance. apig-instance-name is the APIGInstance CRD's metadata.name; loadbalancer-id is
  # its status.id.
  # ⚠️ Helm DEEP-MERGES these maps with values.yaml, so these two keys override dev's — but any
  # NEW key added to values.yaml would silently appear here too. Keep both files in step.
  annotations:
    ingress.vke.volcengine.com/apig-instance-name: lerobot-console-test-apig-instance
    ingress.vke.volcengine.com/loadbalancer-id: gd9ls2o5b1nffgnhd51r0
